<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MaJu</title>
  <meta name="theme-color" content="#F4F1EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MaJu">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="maju-192.png">
  <link rel="apple-touch-icon" href="maju-apple.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
  <style>
    :root {
      --papel: #F4F1EA; --tinta: #1F1E1C; --gris: #6B675F; --linea: #DCD6CA; --linea2: #E6E1D6;
      --borde: #CFC8BA; --shu: #B5482F; --tinta2: #8C8578;
      --mincho: "Shippori Mincho", "Yu Mincho", serif;
      --gothic: "Zen Kaku Gothic New", system-ui, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--gothic); }
    body { min-height: 100dvh; }
    button, input, select { font-family: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .app { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(110px + env(safe-area-inset-bottom)); }
    .app.sin-nav { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    .mincho { font-family: var(--mincho); }
    .gris { color: var(--gris); }
    .shu { color: var(--shu); }
    .etq { font-size: 12px; letter-spacing: 3px; color: var(--gris); text-transform: uppercase; }
    .etq-s { font-size: 11px; letter-spacing: 3px; color: var(--gris); text-transform: uppercase; }
    .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .sello { width: 34px; height: 34px; background: var(--shu); border-radius: 3px; display: flex; align-items: center;
      justify-content: center; color: var(--papel); font-family: var(--mincho); font-size: 12px; line-height: 1;
      writing-mode: vertical-rl; letter-spacing: 1px; flex: none; }
    h1 { margin: 0; font-family: var(--mincho); font-weight: 400; font-size: 34px; }
    .grande { font-family: var(--mincho); font-size: 44px; letter-spacing: -0.5px; line-height: 1.15; margin-top: 6px; }
    .dos { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); margin-top: 26px; }
    .dos > div { padding: 18px 16px 18px 0; display: flex; flex-direction: column; gap: 8px; }
    .dos > div + div { padding: 18px 0 18px 16px; border-left: 1px solid var(--linea); }
    .dos .nombre { font-family: var(--mincho); font-size: 20px; }
    .dos .fila { font-size: 13px; }
    .lista { display: flex; flex-direction: column; }
    .item { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--linea2); }
    .item .t { font-size: 15px; }
    .item .s { font-size: 11px; color: var(--gris); margin-top: 2px; }
    .item .v { font-family: var(--mincho); font-size: 17px; white-space: nowrap; }
    .barra { height: 2px; background: var(--linea); }
    .barra > div { height: 2px; background: var(--tinta); max-width: 100%; }
    .barra.alto > div { background: var(--shu); }
    .mt8 { margin-top: 8px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; } .mt32 { margin-top: 32px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .chips.desliza { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -24px; margin-right: -24px; padding: 0 24px; }
    .chips.desliza::-webkit-scrollbar { display: none; }
    .chip { flex: none; height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--borde); background: transparent; font-size: 14px; }
    .chip.si { background: var(--tinta); border-color: var(--tinta); color: var(--papel); }
    .chip.si.rojo { background: var(--shu); border-color: var(--shu); color: #fff; }
    .boton { height: 54px; border-radius: 27px; border: 0; background: var(--tinta); color: var(--papel); font-size: 15px;
      letter-spacing: 1px; display: flex; align-items: center; justify-content: center; width: 100%; }
    .boton.linea { background: transparent; border: 1px solid var(--tinta); color: var(--tinta); height: 48px; }
    .boton.chico { height: 40px; width: auto; padding: 0 18px; font-size: 13px; }
    .boton:disabled { opacity: .4; }
    .enlace { background: none; border: 0; padding: 8px 0; font-size: 13px; color: var(--gris); text-decoration: underline; text-underline-offset: 3px; }
    .campo { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--linea); }
    .campo label { font-size: 15px; }
    .campo input { width: 150px; text-align: right; border: 0; background: transparent; font-family: var(--mincho); font-size: 18px; padding: 6px 0; outline: none; }
    .campo:focus-within { border-bottom-color: var(--tinta); }
    .texto { width: 100%; border: 0; border-bottom: 1px solid var(--linea); background: transparent; font-size: 15px; padding: 10px 0; outline: none; }
    .texto:focus { border-bottom-color: var(--tinta); }
    nav.abajo { position: fixed; left: 0; right: 0; bottom: 0; background: var(--papel); }
    nav.abajo > div { max-width: 480px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;
      padding: 10px 24px calc(14px + env(safe-area-inset-bottom)); }
    .tabs { display: flex; gap: 26px; }
    .tab { background: none; border: 0; padding: 10px 0; font-size: 14px; color: var(--gris); display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .tab::after { content: ""; width: 4px; height: 4px; border-radius: 50%; }
    .tab.si { color: var(--tinta); }
    .tab.si::after { background: var(--shu); }
    .mas { width: 58px; height: 58px; border-radius: 50%; background: var(--tinta); border: 0; display: flex; align-items: center; justify-content: center; }
    .x { width: 44px; height: 44px; background: none; border: 0; display: flex; align-items: center; justify-content: flex-start; padding: 0; }
    .tipos { display: flex; justify-content: space-between; border-bottom: 1px solid var(--linea); margin-top: 4px; }
    .tipos button { background: none; border: 0; padding: 12px 4px; font-size: 15px; color: var(--gris); border-bottom: 1.5px solid transparent; margin-bottom: -1px; }
    .tipos button.si { color: var(--tinta); border-bottom-color: var(--tinta); }
    .monto { text-align: center; font-family: var(--mincho); font-size: 50px; letter-spacing: -0.5px; margin-top: 18px; min-height: 62px; }
    .teclado { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 12px; }
    .teclado button { height: 52px; background: none; border: 0; font-family: var(--mincho); font-size: 24px; }
    .teclado button:active { background: var(--linea2); border-radius: 26px; }
    .interruptor { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: 0; padding: 12px 0; font-size: 14px; text-align: left; }
    .interruptor .riel { width: 40px; height: 22px; border-radius: 11px; background: var(--linea); position: relative; flex: none; transition: background .2s; }
    .interruptor .riel::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--papel); transition: left .2s; }
    .interruptor.si .riel { background: var(--tinta); }
    .interruptor.si .riel::after { left: 21px; }
    .anillos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 24px; }
    .anillo { background: none; border: 0; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; border-radius: 8px; }
    .anillo.si { background: var(--linea2); }
    .anillo .n { font-size: 13px; }
    .anillo .s { font-size: 11px; color: var(--gris); }
    .caja { padding: 14px 16px; border: 1px solid var(--tinta); border-radius: 4px; }
    .tres { display: grid; grid-template-columns: 1.2fr 1fr 1fr; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--linea2); }
    .tres .d { text-align: right; display: flex; flex-direction: column; gap: 2px; }
    .tres .p { font-size: 10px; letter-spacing: 1px; color: var(--gris); }
    .aviso { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--tinta);
      color: var(--papel); padding: 12px 18px; border-radius: 24px; font-size: 13px; display: flex; gap: 10px; align-items: center;
      max-width: calc(100% - 48px); animation: sube .25s ease-out; z-index: 5; }
    .aviso .sello { width: 22px; height: 22px; font-size: 9px; }
    @keyframes sube { from { opacity: 0; transform: translate(-50%, 8px); } }
    .estampa { animation: estampa .35s ease-out; }
    @keyframes estampa { from { transform: scale(1.6) rotate(-8deg); opacity: 0; } }
    .vacio { padding: 28px 0; text-align: center; font-size: 14px; color: var(--gris); line-height: 1.6; }
    .pasos { display: flex; gap: 6px; }
    .pasos span { width: 18px; height: 2px; background: var(--linea); }
    .pasos span.si { background: var(--tinta); }
    .bols2 { display: grid; grid-template-columns: 1fr 100px 100px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--linea); }
    .bols2 input { width: 100%; text-align: right; border: 0; background: transparent; font-family: var(--mincho); font-size: 16px; padding: 6px 0; outline: none; }
    .confirmar { display: flex; gap: 8px; justify-content: flex-end; padding: 0 0 12px; border-bottom: 1px solid var(--linea2); }
    .mes-sel { display: flex; align-items: center; gap: 4px; }
    .mes-sel button { width: 36px; height: 36px; background: none; border: 0; font-size: 18px; color: var(--gris); }
    .cargando { margin: auto; text-align: center; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div id="raiz"></div>
  <div id="avisos"></div>

  <script>
    // ——— Configuración ———
    // URL de la implementación de Apps Script (maju-google/Codigo.gs). Vacía = modo de prueba (se guarda solo en este celular).
    var URL_MAJU = "https://script.google.com/macros/s/AKfycbzIE5ZKbiBV64JwnLPq88YLkXVwhuIfLZJeuAhCojXIWWb1Q1mgtVJnyiT1ErvBosmI1A/exec";
    var PRUEBA = URL_MAJU.indexOf("https://") !== 0;

    var PERSONAS = ["Juliana", "Manuel"];
    var CUENTAS = ["Nequi", "Nu", "Bancolombia", "Efectivo", "BBVA"];
    // Qué parte de los ingresos del mes va a cada grupo (como en el Excel)
    var GRUPOS = [
      { n: "Necesidades", p: 0.6 }, { n: "Gustos", p: 0.2 }, { n: "Ahorro", p: 0.2 }, { n: "Deudas", p: 0 }, { n: "Inversiones", p: 0 }
    ];
    var MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

    // Solo para el modo de prueba (las de verdad vienen de la hoja de Google)
    var CATEGORIAS_PRUEBA = [
      ["Arriendo", "Necesidades", 0, 1], ["Mercado", "Necesidades", 0, 1], ["Cuidado personal", "Necesidades", 0, 0],
      ["Medicamentos", "Necesidades", 0, 0], ["Luz", "Necesidades", 0, 1], ["Agua", "Necesidades", 0, 1],
      ["Gas", "Necesidades", 0, 1], ["Celular", "Necesidades", 0, 0], ["WiFi", "Necesidades", 0, 1],
      ["Transporte", "Necesidades", 0, 0], ["Salud", "Necesidades", 0, 0], ["Mascotas", "Necesidades", 0, 1],
      ["Lavandería", "Necesidades", 0, 1], ["Gimnasio", "Gustos", 0, 0], ["Salidas", "Gustos", 0, 0],
      ["Entretenimiento", "Gustos", 0, 0], ["Comidas fuera", "Gustos", 0, 0], ["Viajes", "Gustos", 0, 0], ["Uñas", "Gustos", 0, 0],
      ["Cabello", "Gustos", 0, 0], ["Ropa y zapatos", "Gustos", 0, 0], ["Regalos", "Gustos", 0, 0], ["Compras", "Gustos", 0, 0],
      ["Suscripciones", "Gustos", 0, 0], ["Tecnología", "Gustos", 0, 0], ["Cursos", "Gustos", 0, 0],
      ["TC Bancolombia", "Deudas", 0, 0], ["TC Bogotá", "Deudas", 0, 0], ["Deuda a una persona", "Deudas", 0, 0],
      ["ETFs", "Inversiones", 0, 0], ["CDTs", "Inversiones", 0, 0], ["Acciones", "Inversiones", 0, 0],
      ["Inversión inmobiliaria", "Inversiones", 0, 0], ["Criptomonedas", "Inversiones", 0, 0],
      ["Sueldo", "Ingresos", 0, 0], ["Terapias", "Ingresos", 0, 0], ["Clases", "Ingresos", 0, 0], ["Otro ingreso", "Ingresos", 0, 0]
    ].map(function (c) { return { nombre: c[0], grupo: c[1], presupuesto: c[2], casa: !!c[3], activa: true }; });
    var BOLSILLOS_PRUEBA = [
      ["Fondo de emergencias", 0, 0], ["Vivienda", 0, 0], ["Viajes", 0, 0], ["Regalos", 0, 0],
      ["Celebraciones", 0, 0], ["iPhone 17 Pro Max", 0, 0], ["Moto", 0, 0]
    ].map(function (b) { return { nombre: b[0], meta: b[1], aporte: b[2], activo: true }; });

    // ——— Utilidades ———
    function leer(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
    function guardarLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function miles(n) { return String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
    function plata(n) { return (n < 0 ? "− " : "") + "$ " + miles(n); }
    function digitos(s) { return Number(String(s || "").replace(/\D/g, "")) || 0; }
    function dos(n) { return (n < 10 ? "0" : "") + n; }
    function hoy() { var d = new Date(); return d.getFullYear() + "-" + dos(d.getMonth() + 1) + "-" + dos(d.getDate()); }
    function mesActual() { return hoy().slice(0, 7); }
    function nombreMes(m) { return MESES[Number(m.slice(5, 7)) - 1]; }
    function moverMes(m, k) { var a = Number(m.slice(0, 4)), b = Number(m.slice(5, 7)) - 1 + k; a += Math.floor(b / 12); b = ((b % 12) + 12) % 12; return a + "-" + dos(b + 1); }
    function fechaBonita(f) {
      if (f === hoy()) return "hoy";
      var p = f.split("-");
      return Number(p[2]) + " de " + MESES[Number(p[1]) - 1];
    }
    function nuevoId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }

    // ——— Estado ———
    var D = leer("maju-datos") || null;              // lo último que llegó de la hoja
    var PEND = leer("maju-pendientes") || [];        // movimientos anotados que aún no llegan a la hoja
    var CLAVE = leer("maju-clave") || "";
    var YO = leer("maju-yo") || "";
    var S = { pantalla: YO && (PRUEBA || CLAVE) ? "inicio" : "entrar", anterior: "inicio", mes: mesActual(), grupo: "", borrar: "", cargando: false, error: "" };
    var A = null;  // lo que se está anotando
    var W = null;  // pasos de "empezar de cero"
    var Z = null;  // cuenta o bolsillo que se está corrigiendo

    // ——— Hablar con la hoja de Google ———
    function llamar(accion, cuerpo) {
      if (PRUEBA) return Promise.resolve(prueba(accion, cuerpo || {}));
      var datos = Object.assign({ accion: accion, clave: CLAVE }, cuerpo || {});
      return fetch(URL_MAJU, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(datos) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok) throw new Error(j.error === "clave" ? "clave" : (j.detalle || j.error || "error"));
          return j;
        });
    }

    // Imita la hoja de Google guardando todo en el celular
    function prueba(accion, c) {
      var B = leer("maju-prueba") || { movimientos: [], categorias: CATEGORIAS_PRUEBA, bolsillos: BOLSILLOS_PRUEBA, ajustes: {} };
      var ids = {};
      B.movimientos.forEach(function (m) { ids[m.id] = true; });
      if (accion === "guardar" || accion === "empezar") {
        if (accion === "empezar") { B.movimientos = []; ids = {}; B.ajustes.iniciado = hoy(); }
        (c.movimientos || []).forEach(function (m) { if (!ids[m.id]) B.movimientos.push(m); });
      }
      if (accion === "borrar") B.movimientos = B.movimientos.filter(function (m) { return m.id !== c.id; });
      if (accion === "guardarCategorias") B.categorias = c.categorias;
      if (accion === "guardarBolsillos") B.bolsillos = c.bolsillos;
      guardarLocal("maju-prueba", B);
      return JSON.parse(JSON.stringify(Object.assign({ ok: true }, B)));
    }

    function recibir(j) {
      D = { movimientos: j.movimientos || [], categorias: j.categorias || [], bolsillos: j.bolsillos || [], ajustes: j.ajustes || {} };
      var ya = {};
      D.movimientos.forEach(function (m) { ya[m.id] = true; });
      PEND = PEND.filter(function (m) { return !ya[m.id]; });
      guardarLocal("maju-datos", D);
      guardarLocal("maju-pendientes", PEND);
    }

    // Trae lo último y de paso envía lo pendiente
    function sincronizar() {
      var p = PEND.length ? llamar("guardar", { movimientos: PEND }) : llamar("datos");
      return p.then(function (j) { recibir(j); S.error = ""; pintar(); })
        .catch(function (e) {
          if (e.message === "clave") { salir(); S.error = "La clave no es correcta."; pintar(); return; }
          S.error = "sin conexión";
          pintar();
        });
    }

    function todos() { return (D ? D.movimientos : []).concat(PEND.map(function (m) { return Object.assign({ pendiente: true }, m); })); }
    function categorias() { return (D ? D.categorias : []).filter(function (c) { return c.activa !== false; }); }
    function bolsillos() { return (D ? D.bolsillos : []).filter(function (b) { return b.activo !== false; }); }
    function catDe(nombre) { return (D ? D.categorias : []).filter(function (c) { return c.nombre === nombre; })[0]; }

    // ——— Cuentas ———
    function balance() {
      var saldo = {}, guardado = {}, bols = {};
      PERSONAS.forEach(function (p) { saldo[p] = {}; guardado[p] = 0; CUENTAS.forEach(function (c) { saldo[p][c] = 0; }); });
      function suma(p, c, v) { if (!saldo[p]) return; saldo[p][c] = (saldo[p][c] || 0) + v; }
      function bolsa(p, b, v) { if (guardado[p] == null) return; guardado[p] += v; bols[b] = bols[b] || { total: 0 }; bols[b].total += v; bols[b][p] = (bols[b][p] || 0) + v; }
      todos().forEach(function (m) {
        var v = Number(m.valor) || 0;
        if (m.tipo === "Saldo inicial") { if (m.cuenta) suma(m.persona, m.cuenta, v); else bolsa(m.persona, m.categoria, v); }
        else if (m.tipo === "Ingreso") suma(m.persona, m.cuenta, v);
        else if (m.tipo === "Gasto") suma(m.persona, m.cuenta, -v);
        // Los bolsillos son plata APARTADA dentro de las cuentas: no sale de la cuenta ni se suma aparte
        else if (m.tipo === "Ahorro") bolsa(m.persona, m.categoria, v);
        else if (m.tipo === "Retiro ahorro") bolsa(m.persona, m.categoria, -v);
        else if (m.tipo === "Traslado") { suma(m.persona, m.cuenta, -v); suma(m.haciaPersona, m.haciaCuenta, v); }
      });
      var tiene = {}, disp = {};
      PERSONAS.forEach(function (p) {
        tiene[p] = CUENTAS.reduce(function (a, c) { return a + saldo[p][c]; }, 0);
        disp[p] = tiene[p] - guardado[p];  // libre = lo que hay en las cuentas menos lo apartado
      });
      return { saldo: saldo, tiene: tiene, disp: disp, guardado: guardado, bols: bols };
    }

    function delMes(mes) {
      var r = { ingresos: {}, gastoGrupo: {}, gastoCat: {}, gastoPersona: {}, casa: { total: 0 }, claras: 0, gastos: 0 };
      PERSONAS.forEach(function (p) { r.ingresos[p] = 0; r.gastoPersona[p] = 0; r.casa[p] = 0; });
      GRUPOS.forEach(function (g) { r.gastoGrupo[g.n] = 0; });
      var casaCat = {};
      todos().forEach(function (m) {
        if (String(m.fecha).slice(0, 7) !== mes) return;
        var v = Number(m.valor) || 0;
        if (m.tipo === "Ingreso" || m.tipo === "Ingreso previo") r.ingresos[m.persona] = (r.ingresos[m.persona] || 0) + v;
        if (m.tipo === "Gasto") {
          var c = catDe(m.categoria), g = c ? c.grupo : "Gustos";
          r.gastoGrupo[g] = (r.gastoGrupo[g] || 0) + v;
          r.gastoCat[m.categoria] = (r.gastoCat[m.categoria] || 0) + v;
          r.gastoPersona[m.persona] = (r.gastoPersona[m.persona] || 0) + v;
          r.gastos += v;
          if (m.casa) { r.casa.total += v; r.casa[m.persona] = (r.casa[m.persona] || 0) + v; casaCat[m.categoria] = (casaCat[m.categoria] || 0) + v; }
        }
        if (m.tipo === "Ahorro") { r.gastoGrupo.Ahorro += v; r.gastoCat[m.categoria] = (r.gastoCat[m.categoria] || 0) + v; }
        if (m.tipo === "Retiro ahorro") { r.gastoGrupo.Ahorro -= v; r.gastoCat[m.categoria] = (r.gastoCat[m.categoria] || 0) - v; }
        // Lo que Manuel le pasó a Juliana (o al revés) para quedar a paz y salvo
        if (m.tipo === "Traslado" && m.categoria === "Cuentas claras") r.claras += m.persona === "Manuel" ? v : -v;
      });
      r.totalIngresos = r.ingresos.Juliana + r.ingresos.Manuel;
      r.parte = { Juliana: r.totalIngresos ? r.ingresos.Juliana / r.totalIngresos : 0.5 };
      r.parte.Manuel = 1 - r.parte.Juliana;
      r.casaCat = casaCat;
      // > 0: Manuel le debe a Juliana · < 0: Juliana le debe a Manuel
      r.debe = Math.round(r.casa.Juliana - r.casa.total * r.parte.Juliana - r.claras);
      return r;
    }

    function metaGrupo(g, r) {
      if (r.totalIngresos) return Math.round(g.p * r.totalIngresos);
      if (g.n === "Ahorro") return bolsillos().reduce(function (a, b) { return a + (b.aporte || 0); }, 0);
      return categorias().filter(function (c) { return c.grupo === g.n; }).reduce(function (a, c) { return a + (c.presupuesto || 0); }, 0);
    }

    // ——— Piezas ———
    var ICONO_MAS = '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 2v18M2 11h18" stroke="#F4F1EA" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>';
    var ICONO_QUITAR = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2L2 10" stroke="#6B675F" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>';
    var ICONO_X ='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15" stroke="#1F1E1C" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';

    function nav(activa) {
      var t = [["inicio", "Inicio"], ["mes", "Mes"], ["bolsillos", "Bolsillos"]];
      return '<nav class="abajo"><div><div class="tabs">' +
        t.map(function (x) { return '<button class="tab' + (activa === x[0] ? " si" : "") + '" data-a="ir" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join("") +
        '</div><button class="mas" data-a="anotar" aria-label="Anotar un movimiento">' + ICONO_MAS + '</button></div></nav>';
    }

    function chips(lista, elegido, accion, rojo, desliza) {
      return '<div class="chips' + (desliza ? " desliza" : "") + '">' + lista.map(function (v) {
        return '<button class="chip' + (v === elegido ? " si" + (rojo ? " rojo" : "") : "") + '" data-a="' + accion + '" data-v="' + esc(v) + '">' + esc(v) + '</button>';
      }).join("") + '</div>';

    function anillo(porc, rojo) {
      var C = 188.5, largo = Math.max(0, Math.min(1, porc / 100)) * C;

        '<circle cx="38" cy="38" r="30" fill="none" stroke="#DCD6CA" stroke-width="2"/>' +
        (largo > 0 ? '<circle cx="38" cy="38" r="30" fill="none" stroke="' + color + '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + largo.toFixed(1) + ' ' + C + '" transform="rotate(-90 38 38)"/>' : "") +
        '<text x="38" y="43" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="16" fill="' + color + '">' + porc + '%</text></svg>';
    }

    function selectorMes() {
      return '<div class="mes-sel"><button data-a="mes" data-v="-1" aria-label="Mes anterior">‹</button>' +

    function describe(m) {
      if (m.tipo === "Traslado") return (m.categoria === "Cuentas claras" ? "Cuentas claras · " : "") + m.persona + " " + m.cuenta + " → " + m.haciaPersona + " " + m.haciaCuenta;
      if (m.tipo === "Ahorro") return "A " + m.categoria + " · " + m.persona + " · " + m.cuenta;
      if (m.tipo === "Retiro ahorro") return "Sacó de " + m.categoria + " · " + m.persona + " · " + m.cuenta;
      if (m.tipo === "Saldo inicial") return m.persona + (m.cuenta ? " · " + m.cuenta : " · bolsillo");
      if (m.tipo === "Ingreso previo") return "Ingreso del mes (ya estaba en las cuentas) · " + m.persona;
      return (m.nota ? m.categoria + " · " : "") + m.persona + " · " + m.cuenta + (m.casa ? " · de la casa" : "");
    }
    function signo(m) {
      if (m.tipo === "Gasto") return -1;
      if (m.tipo === "Saldo inicial") return m.valor < 0 ? -1 : 1;
      if (m.tipo === "Ingreso" || m.tipo === "Retiro ahorro") return 1;
      return 0;
    }
    function filaMov(m, conBorrar) {
      var s = signo(m), v = (s > 0 ? "+ " : s < 0 ? "− " : "") + "$ " + miles(m.valor);

        '<div><div class="t">' + esc(m.nota || (m.tipo === "Saldo inicial" ? "Saldo inicial" + (m.cuenta ? "" : " · " + m.categoria) : m.categoria || m.tipo)) + (m.pendiente ? ' <span class="shu" style="font-size: 11px">· sin enviar</span>' : "") + '</div>' +
        '<div class="s">' + esc(describe(m)) + '</div></div>' +

        h += '<div class="confirmar"><button class="boton linea chico" data-a="noBorrar">No</button>' +
          '<button class="boton chico" style="background: var(--shu)" data-a="borrar" data-v="' + esc(m.id) + '">Borrar este movimiento</button></div>';

    // ——— Pantallas ———
    function vEntrar() {

        '<div class="sello estampa" style="width: 64px; height: 64px; font-size: 22px; border-radius: 5px">家計</div>' +

          '<h1 style="text-align: center; font-size: 30px; margin-top: 20px">Empecemos de cero</h1>' +
          '<p class="gris" style="text-align: center; font-size: 14px; line-height: 1.6; margin: 10px 12px 0">Anota cuánto hay hoy en cada cuenta. Desde aquí todo empieza limpio.</p>';
      }

          (W.paso === 1 ? "luego Manuel" : "deja en blanco lo que no use") + '</div></div><div class="lista mt8">' +

            return '<div class="campo"><label for="c' + i + '">' + c + '</label><input id="c' + i + '" inputmode="numeric" placeholder="$ 0" data-plata data-campo="' + c + '" value="' + (v ? "$ " + miles(v) : "") + '"></div>';

          '<div class="bols2" style="border: 0; padding-bottom: 0"><span></span><span class="etq-s" style="text-align: right; letter-spacing: 1px">Juliana</span><span class="etq-s" style="text-align: right; letter-spacing: 1px">Manuel</span></div>' +

              }).join("") + '</div>';
          }).join("") +
          '<h2 class="mincho mt32" style="font-weight: 400; font-size: 22px; margin-bottom: 0">Lo que han ganado este mes</h2>' +
          '<p class="gris" style="font-size: 13px; line-height: 1.6; margin: 6px 0 0">Sirve para repartir las cuentas de la casa según lo que gana cada uno. Esta plata ya está en las cuentas, no se suma otra vez.</p>' +
          '<div class="lista mt8">' + PERSONAS.map(function (p, i) {

            return '<div class="campo"><label for="i' + i + '">' + p + '</label><input id="i' + i + '" inputmode="numeric" placeholder="$ 0" data-plata data-ingreso="' + p + '" value="' + (v ? "$ " + miles(v) : "") + '"></div>';

      var meta = r.totalIngresos || GRUPOS.reduce(function (a, g) { return g.n === "Ahorro" ? a : a + metaGrupo(g, r); }, 0);
      var h = '<div class="fila" style="align-items: center"><div class="sello">家計</div>' +
        '<div style="display: flex; align-items: center; gap: 14px"><span class="etq" style="font-size: 13px; letter-spacing: 2px">' + nombreMes(mesActual()) + ' · ' + mesActual().slice(0, 4) + '</span>' +
        '<button class="enlace" style="text-decoration: none; font-size: 18px; letter-spacing: 2px; padding: 4px 0 10px" data-a="ir" data-v="ajustes" aria-label="Ajustes">···</button></div></div>';
      if (PEND.length || S.error) h += '<div class="shu" style="font-size: 12px; margin-top: 8px; text-align: right">' + (PEND.length ? PEND.length + " sin enviar" : "") + (S.error ? (PEND.length ? " · " : "") + S.error : "") + '</div>';

    function vMes() {
      var r = delMes(S.mes);
      var h = '<div class="fila" style="align-items: center">' + selectorMes() + '<div class="gris" style="font-size: 13px">ingresos ' + plata(r.totalIngresos) + '</div></div>';

        return '<button class="anillo' + (S.grupo === g.n ? " si" : "") + '" data-a="grupo" data-v="' + g.n + '" aria-label="' + g.n + ': ' + p + ' %">' + anillo(p, lleno) +
          '<span class="n">' + g.n + '</span><span class="s' + (lleno ? " shu" : "") + '">' + (lleno ? (usado > meta ? "se pasó" : "al límite") : Math.round(g.p * 100) + " % · " + plata(meta)) + '</span></button>';

      h += hayPresupuesto

        : '<div class="caja mt16"><div class="etq-s">Presupuesto</div><div style="font-size: 14px; margin-top: 6px; line-height: 1.5">Aún no tienen presupuesto. Escriban cuánto esperan gastar en cada cosa este mes.</div>' +
          '<button class="boton chico mt16" style="width: 100%" data-a="ir" data-v="ajustes">Armar el presupuesto</button></div>';

        (casa.length ? casa.map(function (c) {

      }

    function vBolsillos() {
      var b = balance();

      var h = '<h1>Bolsillos</h1><div class="gris" style="font-size: 13px; margin-top: 6px; line-height: 1.5">Plata apartada dentro de sus cuentas para cada meta.</div>' +

        }).join("") + '</div><div class="gris" style="font-size: 11px; margin-top: 6px">Toca un bolsillo para corregir cuánto hay.</div>' +
        '<button class="boton linea mt16" data-a="anotar" data-v="Ahorro">Mover plata a un bolsillo</button>';

    function categoriasPara(tipo) {
      if (tipo === "Ingreso") return categorias().filter(function (c) { return c.grupo === "Ingresos"; }).map(function (c) { return c.nombre; });
      if (tipo === "Ahorro") return bolsillos().map(function (b) { return b.nombre; });
      if (tipo === "Traslado") return [];
      // Gastos: primero las que más usan
      var uso = {};
      todos().slice(-300).forEach(function (m) { if (m.tipo === "Gasto") uso[m.categoria] = (uso[m.categoria] || 0) + 1; });
      return categorias().filter(function (c) { return c.grupo !== "Ingresos"; })
        .sort(function (a, b) { return (uso[b.nombre] || 0) - (uso[a.nombre] || 0); }).map(function (c) { return c.nombre; });
    }

    function vAnotar() {
      var t = A.tipo;
      var signoT = t === "Gasto" ? "− " : t === "Ingreso" ? "+ " : "";
      var h = '<div class="fila" style="align-items: center"><button class="x" data-a="cerrar" aria-label="Cerrar">' + ICONO_X + '</button>' +

      }

    // Corregir cuánto hay en una cuenta o bolsillo: guarda la diferencia como un ajuste (no cuenta como ingreso ni gasto)
    function actualDe(z) {
      var b = balance();
      return z.bolsillo ? ((b.bols[z.nombre] || {})[z.persona] || 0) : b.saldo[z.persona][z.nombre];
    }
    function vSaldo() {
      var actual = actualDe(Z);
      var h = '<div class="fila" style="align-items: center"><button class="x" data-a="cerrar" aria-label="Cerrar">' + ICONO_X + '</button><span class="etq">Corregir saldo</span><span style="width: 44px"></span></div>' +
        '<h1 class="mt24">' + esc(Z.nombre) + '</h1>' +
        '<div class="etq-s mt24">De quién</div>' + chips(PERSONAS, Z.persona, "saldoPersona") +

    function vHistorial() {
      var lista = todos().filter(function (m) { return String(m.fecha).slice(0, 7) === S.mes; })
        .sort(function (a, b) { return (b.fecha + (b.anotado || "")).localeCompare(a.fecha + (a.anotado || "")); });
      var h = '<div class="fila" style="align-items: center"><button class="x" data-a="ir" data-v="inicio" aria-label="Volver">' + ICONO_X + '</button><span class="etq">Movimientos</span><span style="width: 44px"></span></div>' +
        '<div class="mt16">' + selectorMes() + '</div>';
      if (!lista.length) return { html: h + '<div class="vacio">No hay movimientos en ' + nombreMes(S.mes) + '.</div>', nav: "inicio" };
      var dia = "";
      h += '<div class="gris" style="font-size: 12px; margin-top: 4px">Toca uno para borrarlo.</div>';
      lista.forEach(function (m) {
        if (m.fecha !== dia) { dia = m.fecha; h += '<div class="etq-s" style="margin-top: 22px">' + fechaBonita(dia) + '</div>'; }
        h += filaMov(m, true);
      });

    function vAjustes() {
      var cats = D ? D.categorias : [], bols = D ? D.bolsillos : [];
      var h = '<div class="fila" style="align-items: center"><button class="x" data-a="ir" data-v="inicio" aria-label="Volver">' + ICONO_X + '</button><span class="etq">Ajustes</span><span style="width: 44px"></span></div>' +
        '<div class="etq-s mt24">En este celular eres</div>' + chips(PERSONAS, YO, "yo");
      h += '<h2 class="mincho mt32" style="font-weight: 400; font-size: 24px; margin-bottom: 0">Presupuesto del mes</h2>' +
        '<div class="gris" style="font-size: 12px; margin-top: 4px">Cuánto esperan gastar en cada cosa. "Casa" = se reparte según lo que gana cada uno.</div>';
      ["Necesidades", "Gustos", "Deudas", "Inversiones", "Ingresos"].forEach(function (g) {
        h += '<div class="etq-s mt24">' + g + '</div><div class="lista">' + cats.map(function (c, i) {
          if (c.grupo !== g || c.activa === false) return "";
          var quitar = '<button class="x" style="width: 32px; height: 32px; justify-content: center; flex: none" data-a="quitarCat" data-v="' + i + '" aria-label="Quitar ' + esc(c.nombre) + '">' + ICONO_QUITAR + '</button>';
          if (g === "Ingresos") return '<div class="campo"><span style="flex: 1; font-size: 14px; padding: 6px 0">' + esc(c.nombre) + '</span>' + quitar + '</div>';
          return '<div class="campo" style="gap: 8px"><label for="p' + i + '" style="flex: 1; font-size: 14px">' + esc(c.nombre) + '</label>' +
            '<button class="chip' + (c.casa ? " si" : "") + '" style="height: 30px; padding: 0 10px; font-size: 12px" data-a="catCasa" data-v="' + i + '" aria-pressed="' + !!c.casa + '">casa</button>' +
            '<input id="p' + i + '" style="width: 104px" inputmode="numeric" placeholder="$ 0" data-plata data-cat="' + i + '" value="' + (c.presupuesto ? "$ " + miles(c.presupuesto) : "") + '">' + quitar + '</div>';
        }).join("") + '</div>';
      });
      h += '<div class="etq-s mt24">Nueva categoría</div><input class="texto" id="nuevaCat" placeholder="Nombre" value="' + esc(S.nuevaCat || "") + '">' +
        chips(["Necesidades", "Gustos", "Deudas", "Inversiones", "Ingresos"], S.nuevoGrupo || "Necesidades", "nuevoGrupo");
      h += '<h2 class="mincho mt32" style="font-weight: 400; font-size: 24px; margin-bottom: 0">Bolsillos</h2>' +
        '<div class="bols2" style="border: 0; padding-bottom: 0; grid-template-columns: 1fr 92px 92px 32px"><span></span><span class="etq-s" style="text-align: right; letter-spacing: 1px">Meta</span><span class="etq-s" style="text-align: right; letter-spacing: 1px">Al mes</span><span></span></div>' +
        bols.map(function (b, i) {
          if (b.activo === false) return "";
          return '<div class="bols2" style="grid-template-columns: 1fr 92px 92px 32px"><span style="font-size: 14px">' + esc(b.nombre) + '</span>' +
            '<input inputmode="numeric" placeholder="$ 0" aria-label="Meta de ' + esc(b.nombre) + '" data-plata data-meta="' + i + '" value="' + (b.meta ? "$ " + miles(b.meta) : "") + '">' +
            '<input inputmode="numeric" placeholder="$ 0" aria-label="Aporte al mes de ' + esc(b.nombre) + '" data-plata data-aporte="' + i + '" value="' + (b.aporte ? "$ " + miles(b.aporte) : "") + '">' +
            '<button class="x" style="width: 32px; height: 32px; justify-content: center" data-a="quitarBols" data-v="' + i + '" aria-label="Quitar ' + esc(b.nombre) + '">' + ICONO_QUITAR + '</button></div>';
        }).join("") +
        '<input class="texto mt8" id="nuevoBols" placeholder="Nuevo bolsillo (nombre)" value="' + esc(S.nuevoBols || "") + '">';
      var quitadas = cats.map(function (c, i) { return c.activa === false ? '<button class="chip" data-a="devolverCat" data-v="' + i + '">↺ ' + esc(c.nombre) + '</button>' : ""; }).join("") +
        bols.map(function (b, i) { return b.activo === false ? '<button class="chip" data-a="devolverBols" data-v="' + i + '">↺ ' + esc(b.nombre) + '</button>' : ""; }).join("");
      if (quitadas) h += '<div class="etq-s mt32">Quitadas</div><div class="gris" style="font-size: 12px; margin-top: 4px">Ya no salen en la app, pero lo anotado antes se conserva. Toca una para devolverla.</div><div class="chips">' + quitadas + '</div>';

        '<button class="boton mt24" data-a="guardarAjustes"' + (S.cargando ? " disabled" : "") + '>' + (S.cargando ? "Guardando…" : "Guardar cambios") + '</button>' +

        '<div style="display: flex; justify-content: space-between; margin-top: 32px">' +
        '<button class="enlace" data-a="reiniciar">Empezar de cero otra vez</button><button class="enlace" data-a="salir">Salir</button></div>' +
        (PRUEBA ? '<div class="gris mt16" style="font-size: 12px">Modo de prueba: todo se guarda solo en este celular.</div>' : "");
      return { html: h, nav: false };

    // ——— Pintar ———
    function pintar() {
      var foco = document.activeElement && document.activeElement.id;
      var v;
      if (!YO || (!PRUEBA && !CLAVE) || S.pantalla === "entrar") v = vEntrar();
      else if (!D) v = { html: '<div class="cargando"><div class="sello estampa" style="margin: 0 auto">家計</div><div class="gris mt16" style="font-size: 13px">' + (S.error || "Cargando…") + '</div></div>', nav: false };
      else if (!D.ajustes || !D.ajustes.iniciado || S.pantalla === "empezar") { if (!W) W = nuevoW(); v = vEmpezar(); }
      else v = ({ inicio: vInicio, mes: vMes, bolsillos: vBolsillos, anotar: vAnotar, historial: vHistorial, ajustes: vAjustes, saldo: vSaldo }[S.pantalla] || vInicio)();
      document.getElementById("raiz").innerHTML = '<main class="app' + (v.nav ? "" : " sin-nav") + '">' + v.html + '</main>' + (v.nav ? nav(v.nav) : "");
      if (foco && document.getElementById(foco)) document.getElementById(foco).focus();
    }

    function avisar(txt) {
      var c = document.getElementById("avisos");
      c.innerHTML = '<div class="aviso" role="status"><span class="sello estampa">済</span><span>' + esc(txt) + '</span></div>';
      clearTimeout(avisar.t);
      avisar.t = setTimeout(function () { c.innerHTML = ""; }, 2600);
    }

    function ir(p) { S.anterior = S.pantalla === "anotar" ? S.anterior : S.pantalla; S.pantalla = p; S.borrar = ""; S.error = S.error === "sin conexión" ? S.error : ""; pintar(); window.scrollTo(0, 0); }

    function nuevoW() {
      var w = { paso: 1, cuentas: {}, bols: {}, ingresos: {} };
      PERSONAS.forEach(function (p) { w.cuentas[p] = {}; w.bols[p] = {}; });
      return w;
    }

    function leerPaso() {
      var raiz = document.getElementById("raiz");
      if (W.paso < 3) {
        var p = PERSONAS[W.paso - 1];
        raiz.querySelectorAll("[data-campo]").forEach(function (el) { W.cuentas[p][el.dataset.campo] = digitos(el.value); });
      } else {
        raiz.querySelectorAll("[data-bols]").forEach(function (el) { W.bols[el.dataset.persona][el.dataset.bols] = digitos(el.value); });
        raiz.querySelectorAll("[data-ingreso]").forEach(function (el) { W.ingresos[el.dataset.ingreso] = digitos(el.value); });
      }
    }

    function nuevoA(tipo) {
      var ultima = leer("maju-cuenta") || "Nu";
      var a = { tipo: tipo || "Gasto", sacar: false, quien: YO, cuenta: ultima, haciaPersona: YO === "Juliana" ? "Manuel" : "Juliana", haciaCuenta: "Nequi",
        cat: "", casa: false, monto: "", fecha: hoy(), nota: "", claras: false };
      ponerCat(a);
      return a;
    }
    function ponerCat(a) {
      var lista = categoriasPara(a.tipo);
      a.cat = lista[0] || "";
      var c = catDe(a.cat);
      a.casa = a.tipo === "Gasto" && !!(c && c.casa);
    }

    // ——— Acciones ———
    var ACC = {
      ir: function (v) { ir(v); },
      yo: function (v) {
        YO = v; guardarLocal("maju-yo", v);
        if (S.pantalla === "entrar" || !D) { var c = document.getElementById("clave"); if (c) CLAVE = c.value; }
        pintar();
      },
      entrar: function () {
        var c = document.getElementById("clave");

        if (!PRUEBA && !CLAVE) { S.error = "Escribe la clave."; pintar(); return; }
        S.cargando = true; S.error = ""; pintar();
        llamar("datos").then(function (j) {
          guardarLocal("maju-clave", CLAVE); recibir(j); S.cargando = false; S.pantalla = "inicio"; pintar();
        }).catch(function (e) {
          S.cargando = false; S.pantalla = "entrar";
          S.error = e.message === "clave" ? "La clave no es correcta." : "No se pudo conectar. Revisa el internet.";
          pintar();
        });
      },
      salir: function () { salir(); pintar(); },
      anotar: function (v) { A = nuevoA(v); S.error = S.error === "sin conexión" ? S.error : ""; ir("anotar"); },
      cerrar: function () { ir(S.anterior || "inicio"); },
      tipo: function (v) { A.tipo = v; A.claras = false; ponerCat(A); pintar(); },
      sacar: function (v) { A.sacar = v === "Sacar"; pintar(); },
      quien: function (v) { A.quien = v; if (A.tipo === "Traslado" && A.haciaPersona === v && A.haciaCuenta === A.cuenta) A.haciaCuenta = CUENTAS.filter(function (c) { return c !== A.cuenta; })[0]; pintar(); },
      cuenta: function (v) { A.cuenta = v; pintar(); },
      haciaPersona: function (v) { A.haciaPersona = v; pintar(); },
      haciaCuenta: function (v) { A.haciaCuenta = v; pintar(); },
      cat: function (v) { A.cat = v; var c = catDe(v); if (A.tipo === "Gasto") A.casa = !!(c && c.casa); pintar(); },
      casa: function () { A.casa = !A.casa; pintar(); },
      tecla: function (v) {
        if (v === "⌫") A.monto = A.monto.slice(0, -1);
        else if (A.monto.length < 10) A.monto = (A.monto + v).replace(/^0+/, "");
        pintar();
      },
      guardarMov: function () {
        var valor = digitos(A.monto);
        if (!valor) { S.error = "Escribe cuánto fue."; pintar(); return; }
        if (A.tipo === "Traslado" && A.quien === A.haciaPersona && A.cuenta === A.haciaCuenta) { S.error = "La cuenta de salida y la de llegada son la misma."; pintar(); return; }
        if (A.tipo !== "Traslado" && !A.cat) { S.error = "Elige una categoría."; pintar(); return; }
        var m = { id: nuevoId(), fecha: A.fecha || hoy(), tipo: A.tipo === "Ahorro" && A.sacar ? "Retiro ahorro" : A.tipo, persona: A.quien, cuenta: A.cuenta,
          haciaPersona: A.tipo === "Traslado" ? A.haciaPersona : "", haciaCuenta: A.tipo === "Traslado" ? A.haciaCuenta : "",
          categoria: A.tipo === "Traslado" ? (A.claras ? "Cuentas claras" : "") : A.cat, valor: valor, casa: A.tipo === "Gasto" && A.casa,
          nota: A.nota.trim(), anoto: YO, anotado: new Date().toISOString() };
        PEND.push(m); guardarLocal("maju-pendientes", PEND);
        if (A.quien === YO) guardarLocal("maju-cuenta", A.cuenta);
        var txt = "Anotado · " + (m.categoria || "Traslado") + " · $ " + miles(valor);
        S.error = "";
        ir(S.anterior || "inicio");
        avisar(txt);
        sincronizar();
      },
      mes: function (v) { S.mes = moverMes(S.mes, Number(v)); S.grupo = ""; pintar(); },
      grupo: function (v) { S.grupo = S.grupo === v ? "" : v; pintar(); },
      saldar: function (v, el) {

      },
      ajustar: function (v, el) { Z = { nombre: v, bolsillo: !!el.dataset.bolsillo, persona: YO }; ir("saldo"); },
      saldoPersona: function (v) { Z.persona = v; pintar(); },
      guardarSaldo: function () {
        var el = document.getElementById("real");
        if (!el.value.trim()) { el.focus(); return; }
        var diff = digitos(el.value) - actualDe(Z);
        if (!diff) { ir(S.anterior || "inicio"); avisar("Ya estaba bien"); return; }
        PEND.push({ id: nuevoId(), fecha: hoy(), tipo: "Saldo inicial", persona: Z.persona, cuenta: Z.bolsillo ? "" : Z.nombre,
          categoria: Z.bolsillo ? Z.nombre : "", valor: diff, casa: false, nota: "Ajuste de saldo", anoto: YO, anotado: new Date().toISOString() });
        guardarLocal("maju-pendientes", PEND);
        ir(S.anterior || "inicio");
        avisar("Saldo corregido · " + Z.nombre + " de " + Z.persona);
        sincronizar();
      },
      tocarMov: function (v) { S.borrar = S.borrar === v ? "" : v; pintar(); },
      noBorrar: function () { S.borrar = ""; pintar(); },
      borrar: function (v) {
        S.borrar = "";
        if (PEND.some(function (m) { return m.id === v; })) {
          PEND = PEND.filter(function (m) { return m.id !== v; }); guardarLocal("maju-pendientes", PEND); pintar(); avisar("Borrado"); return;
        }
        D.movimientos = D.movimientos.filter(function (m) { return m.id !== v; }); pintar();
        llamar("borrar", { id: v }).then(function (j) { recibir(j); pintar(); avisar("Borrado"); })
          .catch(function () { S.error = "No se pudo borrar (sin conexión)."; sincronizar(); });
      },
      paso: function (v) {
        leerPaso();
        S.error = "";
        if (Number(v) < 0) { W.paso--; pintar(); return; }
        if (W.paso < 3) { W.paso++; pintar(); window.scrollTo(0, 0); return; }
        var f = hoy(), movs = [];
        PERSONAS.forEach(function (p) {
          CUENTAS.forEach(function (c) { if (W.cuentas[p][c]) movs.push({ tipo: "Saldo inicial", persona: p, cuenta: c, valor: W.cuentas[p][c] }); });
          Object.keys(W.bols[p]).forEach(function (b) { if (W.bols[p][b]) movs.push({ tipo: "Saldo inicial", persona: p, cuenta: "", categoria: b, valor: W.bols[p][b] }); });
          if (W.ingresos[p]) movs.push({ tipo: "Ingreso previo", persona: p, categoria: "Sueldo", valor: W.ingresos[p] });
        });
        movs.forEach(function (m) { m.id = nuevoId(); m.fecha = f; m.anoto = YO; m.anotado = new Date().toISOString(); });
        S.cargando = true; pintar();
        llamar("empezar", { movimientos: movs }).then(function (j) {
          PEND = []; recibir(j); W = null; S.cargando = false; S.pantalla = "inicio"; pintar(); avisar("Listo. Desde hoy, todo en orden.");
        }).catch(function () { S.cargando = false; S.error = "No se pudo guardar. Revisa el internet e intenta otra vez."; pintar(); });
      },
      reiniciar: function () {
        if (!confirm("¿Empezar de cero otra vez? Lo anotado hasta hoy queda guardado aparte en la hoja de Google, pero la app arranca con saldos nuevos.")) return;
        W = nuevoW(); S.pantalla = "empezar"; pintar(); window.scrollTo(0, 0);
      },
      catCasa: function (v) { leerAjustes(); D.categorias[Number(v)].casa = !D.categorias[Number(v)].casa; S.cambios = true; pintar(); },
      quitarCat: function (v) { leerAjustes(); D.categorias[Number(v)].activa = false; S.cambios = true; pintar(); },
      devolverCat: function (v) { leerAjustes(); D.categorias[Number(v)].activa = true; S.cambios = true; pintar(); },
      quitarBols: function (v) {
        leerAjustes();
        var b = D.bolsillos[Number(v)], hay = (balance().bols[b.nombre] || { total: 0 }).total;
        if (hay > 0 && !confirm(b.nombre + " todavía tiene " + plata(hay) + ". Si lo quitas, esa plata sigue contando en lo guardado pero ya no se ve el bolsillo. Mejor sácala primero (Anotar → Ahorro → Sacar). ¿Quitarlo igual?")) return;
        b.activo = false; S.cambios = true; pintar();
      },
      devolverBols: function (v) { leerAjustes(); D.bolsillos[Number(v)].activo = true; S.cambios = true; pintar(); },
      nuevoGrupo: function (v) { leerAjustes(); S.nuevoGrupo = v; pintar(); },
      guardarAjustes: function () {
        leerAjustes();
        var nc = (S.nuevaCat || "").trim(), nb = (S.nuevoBols || "").trim();
        if (nc) D.categorias.push({ nombre: nc, grupo: S.nuevoGrupo || "Necesidades", presupuesto: 0, casa: false, activa: true });
        if (nb) D.bolsillos.push({ nombre: nb, meta: 0, aporte: 0, activo: true });
        S.cargando = true; S.error = ""; pintar();
        llamar("guardarCategorias", { categorias: D.categorias })
          .then(function () { return llamar("guardarBolsillos", { bolsillos: D.bolsillos }); })
          .then(function (j) { recibir(j); S.cargando = false; S.cambios = false; S.nuevaCat = ""; S.nuevoBols = ""; pintar(); avisar("Cambios guardados"); })
          .catch(function () { S.cargando = false; S.error = "No se pudo guardar. Revisa el internet."; pintar(); });
      }
    };

    // Lo escrito en Ajustes se guarda en D antes de volver a pintar, para no perderlo
    function leerAjustes() {
      var raiz = document.getElementById("raiz");
      raiz.querySelectorAll("[data-cat]").forEach(function (el) { D.categorias[Number(el.dataset.cat)].presupuesto = digitos(el.value); });
      raiz.querySelectorAll("[data-meta]").forEach(function (el) { D.bolsillos[Number(el.dataset.meta)].meta = digitos(el.value); });
      raiz.querySelectorAll("[data-aporte]").forEach(function (el) { D.bolsillos[Number(el.dataset.aporte)].aporte = digitos(el.value); });
      var nc = document.getElementById("nuevaCat"), nb = document.getElementById("nuevoBols");
      if (nc) S.nuevaCat = nc.value;
      if (nb) S.nuevoBols = nb.value;
    }

    function salir() {
      CLAVE = ""; D = null; PEND = PEND || [];
      try { localStorage.removeItem("maju-clave"); localStorage.removeItem("maju-datos"); } catch (e) {}
      S.pantalla = "entrar";
    }

    document.addEventListener("click", function (e) {
      var b = e.target.closest("[data-a]");
      if (!b || !ACC[b.dataset.a]) return;
      ACC[b.dataset.a](b.dataset.v, b);
    });
    document.addEventListener("input", function (e) {
      var el = e.target;
      if (el.hasAttribute("data-plata")) { var n = digitos(el.value); el.value = n ? "$ " + miles(n) : ""; }
      if (el.dataset.a2 === "nota" && A) A.nota = el.value;
    });
    document.addEventListener("change", function (e) {
      if (e.target.dataset.a2 === "fecha" && A) { A.fecha = e.target.value || hoy(); pintar(); }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target.id === "clave") ACC.entrar();
    });
    window.addEventListener("online", function () { if (D) sincronizar(); });
    document.addEventListener("visibilitychange", function () { if (!document.hidden && D && (PRUEBA || CLAVE)) sincronizar(); });

    pintar();
    if (YO && (PRUEBA || CLAVE)) sincronizar();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  </script>
</body>
</html>
